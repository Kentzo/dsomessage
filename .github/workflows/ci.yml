name: CI
on:
  push:
    branches: [main, docs]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go test -race -coverprofile=coverage.out ./...
      - uses: coverallsapp/github-action@v2
        with:
          file: coverage.out
          format: golang
